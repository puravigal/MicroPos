<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puravigal POS — UI Mock</title>
<style>
:root{--blue:#235BDE;--pink:#ED0F79;--ink:#17213b;--muted:#6d778c;--bg:#f7f9fc;--card:#fff;--line:#e6ebf3;--soft:#eef3ff;--green:#18a36b;--amber:#d98b12;--red:#d9485f;--shadow:0 8px 28px rgba(30,55,100,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:230px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}.mark{width:34px;height:34px;position:relative}.mark:before,.mark:after{content:"";position:absolute;border-radius:10px 3px 10px 3px;transform:rotate(-42deg)}.mark:before{width:14px;height:25px;left:2px;top:2px;background:var(--blue)}.mark:after{width:14px;height:20px;right:1px;bottom:2px;background:var(--pink)}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.nav-title{font-size:10px;color:#9aa3b3;font-weight:800;letter-spacing:.12em;padding:8px;text-transform:uppercase}.nav button{display:flex;width:100%;gap:11px;align-items:center;border:0;background:transparent;color:#59657a;padding:11px 10px;border-radius:10px;text-align:left;margin:2px 0}.nav button.active{background:var(--soft);color:var(--blue);font-weight:800}.nav button .ico{width:22px;text-align:center}.sidebar-foot{margin-top:auto;background:#f8faff;border:1px solid #e7edfa;border-radius:12px;padding:12px}.sidebar-foot b{font-size:12px}.sidebar-foot small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.main{margin-left:230px}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:8}.search{width:min(440px,45vw);border:1px solid #dfe5ee;background:#fff;border-radius:10px;padding:10px 13px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #235bde12}.top-right{display:flex;align-items:center;gap:12px}.store{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.content{padding:24px;max-width:1450px;margin:auto}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:17px}.eyebrow{font-size:10px;letter-spacing:.13em;font-weight:900;color:var(--blue);margin:0 0 5px}.head h1{font-size:26px;letter-spacing:-.02em;margin:0}.head p{color:var(--muted);margin:5px 0 0;font-size:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;color:#4d596d;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 7px 18px #235bde22}.btn.pink{color:var(--pink);border-color:#f4c8dc;background:#fff7fb}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:15px}.stat .label{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin:5px 0}.stat small{font-size:10px;color:var(--green);font-weight:800}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}.card{padding:17px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.card-head h3{margin:0;font-size:15px}.card-head small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.chart{height:210px;display:flex;align-items:flex-end;gap:14px;padding:18px 12px 10px;border-top:1px solid #f0f2f6}.bar{flex:1;background:linear-gradient(to top,#235bde,#77a0ff);border-radius:7px 7px 2px 2px;min-width:16px;position:relative}.bar i{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-style:normal;font-size:9px;color:#8992a4}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:28px;min-height:210px}.donut{width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--blue) 0 55%,var(--pink) 55% 79%,#7ea8ff 79% 91%,#dce3ef 91%);display:grid;place-items:center}.donut:after{content:"₹24,750";width:92px;height:92px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px}.legend div{font-size:11px;margin:10px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--blue)}.dot.p{background:var(--pink)}.dot.l{background:#7ea8ff}.rows{margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef1f5;padding:11px 2px;font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.pill{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:900;background:#eef3ff;color:var(--blue)}.pill.p{background:#fff0f6;color:var(--pink)}.pill.g{background:#edf9f3;color:var(--green)}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{text-align:left;padding:11px 9px;border-top:1px solid #edf0f4;font-size:12px}.table th{font-size:9px;color:#8791a4;text-transform:uppercase;background:#fbfcfe}.danger{color:var(--red);font-weight:900}.warn{color:var(--amber);font-weight:900}.section-gap{margin-top:14px}.pos{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.product{border:1px solid var(--line);background:#fbfcff;border-radius:11px;padding:12px;text-align:left}.product:hover{border-color:#aec1f3;background:#f5f8ff}.product b,.product small,.product strong{display:block}.product small{color:var(--muted);font-size:10px;margin:4px 0}.cart{margin-top:14px}.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;border-top:1px solid #edf0f4;padding:12px 0}.qty{display:flex;align-items:center;gap:7px}.qty button{width:27px;height:27px;border:1px solid var(--line);background:#fff;border-radius:7px}.totals{border-top:1px solid #edf0f4;margin-top:12px;padding-top:10px}.totals div{display:flex;justify-content:space-between;margin:9px 0;font-size:12px}.totals .grand{font-size:18px;font-weight:900;border-top:1px solid #edf0f4;padding-top:12px}.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.pay button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-size:9px;font-weight:800}.pay button.active{color:var(--blue);border-color:var(--blue);background:var(--soft)}.field{display:block;margin:10px 0}.field label{display:block;font-size:10px;font-weight:800;color:#69748a;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #dfe5ee;border-radius:8px;padding:10px;outline:none;background:#fff}.toast{position:fixed;right:20px;bottom:20px;background:#17213b;color:#fff;padding:12px 15px;border-radius:9px;z-index:50;font-size:12px;box-shadow:var(--shadow)}.mobile-nav{display:none}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.pos{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{display:none}.main{margin:0}.top{height:60px;padding:0 13px}.search{width:58vw}.content{padding:14px}.head{align-items:stretch;flex-direction:column}.head h1{font-size:22px}.grid4{gap:8px}.stat{padding:12px}.stat strong{font-size:18px}.product-grid{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:20;justify-content:space-around}.mobile-nav button{border:0;background:none;color:#6d778c;font-size:9px}.mobile-nav button.active{color:var(--blue);font-weight:900}.mobile-nav span{display:block;font-size:17px;margin-bottom:2px}.content{padding-bottom:80px}.top-right .store{display:none}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="mark"></div><div><b>Puravigal</b><small>POS · Simple. Fast. Reliable.</small></div></div><div class="nav-title">Workspace</div><nav class="nav" id="nav"></nav><div class="sidebar-foot"><b>Micro POS</b><small>UI mock · API not connected</small></div></aside><div class="main"><header class="top"><input class="search" placeholder="Search products, customers, invoices..." oninput="state.search=this.value;render()"><div class="top-right"><button class="store">▣ Main Store⌄</button><div>🔔</div><div class="avatar">S</div></div></header><main class="content" id="content"></main></div><nav class="mobile-nav" id="mobileNav"></nav></div><div id="toast"></div>
<script>
const products=[
{id:1,name:"Milk 1L",sku:"PRD-001",stock:42,min:10,price:62,cat:"Dairy"},
{id:2,name:"Bread Loaf",sku:"PRD-002",stock:8,min:12,price:40,cat:"Bakery"},
{id:3,name:"Maggi Noodles",sku:"PRD-003",stock:25,min:8,price:15,cat:"Grocery"},
{id:4,name:"Cooking Oil 1L",sku:"PRD-004",stock:4,min:10,price:148,cat:"Grocery"},
{id:5,name:"Biscuit Pack",sku:"PRD-005",stock:31,min:10,price:35,cat:"Snacks"},
{id:6,name:"Chocolate Bar",sku:"PRD-006",stock:19,min:8,price:50,cat:"Snacks"},
{id:7,name:"Water Bottle",sku:"PRD-007",stock:55,min:15,price:20,cat:"Beverages"},
{id:8,name:"Tea Powder 250g",sku:"PRD-008",stock:13,min:8,price:92,cat:"Grocery"}
];
const navs=[["dashboard","⌂","Dashboard"],["billing","₹","Billing"],["products","▦","Products"],["inventory","◈","Inventory"],["purchases","↗","Purchases"],["customers","◎","Customers"],["suppliers","◇","Suppliers"],["reports","▥","Reports"],["returns","↩","Returns"],["settings","⚙","Settings"]];
const state={page:"dashboard",search:"",cart:[],method:"cash"};
function money(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(n||0)}
function toast(t){document.getElementById("toast").innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>document.getElementById("toast").innerHTML="",2200)}
function setPage(p){state.page=p;state.search="";render()}
function nav(){return navs.map(([id,ic,label])=>'<button class="'+(state.page===id?"active":"")+'" onclick="setPage(\''+id+'\')"><span class="ico">'+ic+'</span>'+label+'</button>').join("")}
function shell(title,sub,action){return '<div class="head"><div><p class="eyebrow">PURAVIGAL POS</p><h1>'+title+'</h1><p>'+sub+'</p></div>'+(action||"")+'</div>'}
function dashboard(){
const low=products.filter(p=>p.stock<=p.min);
return shell("Good morning, Selva!","Clear numbers, faster billing and a calm retail workflow.","<button class='btn primary' onclick="setPage('billing')">＋ New Bill</button>")+
'<div class="grid4"><div class="stat"><span class="label">Sales Today</span><strong>₹24,750</strong><small>↑ 12% vs yesterday</small></div><div class="stat"><span class="label">Total Bills</span><strong>18</strong><small>↑ 6% vs yesterday</small></div><div class="stat"><span class="label">Average Bill</span><strong>₹1,375</strong><small>↑ 8% vs yesterday</small></div><div class="stat"><span class="label">Outstanding</span><strong>₹5,820</strong><small style="color:var(--pink)">View customer ledger →</small></div></div>'+
'<div class="two"><section class="card"><div class="card-head"><div><h3>Sales Overview</h3><small>Last 7 days</small></div><button class="btn">Last 7 Days⌄</button></div><div class="chart">'+[48,61,72,55,66,88,74].map((x,i)=>'<div class="bar" style="height:'+x+'%"><i>'+["01 Oct","02","03","04","05","06","07"][i]+'</i></div>').join("")+'</div></section><section class="card"><div class="card-head"><div><h3>Payment Breakdown</h3><small>Today's collections</small></div></div><div class="donut-wrap"><div class="donut"></div><div class="legend"><div><i class="dot"></i>UPI · 52%</div><div><i class="dot p"></i>Cash · 24%</div><div><i class="dot l"></i>Card · 16%</div><div><i class="dot" style="background:#dce3ef"></i>Others · 8%</div></div></div></section></div>'+
'<div class="two"><section class="card"><div class="card-head"><div><h3>Low Stock Products</h3><small>'+low.length+' items need attention</small></div><button class="btn ghost-blue" onclick="setPage('inventory')">View All →</button></div>'+low.map(p=>'<div class="row"><div><b>'+p.name+'</b><small>'+p.sku+'</small></div><span class="pill p">'+p.stock+' left</span></div>').join("")+'</section><section class="card"><div class="card-head"><div><h3>Recent Transactions</h3><small>Latest activity</small></div><button class="btn ghost-blue" onclick="setPage('reports')">View All →</button></div>'+["INV-1008 · ₹1,250","INV-1007 · ₹980","PUR-0032 · ₹4,800","RET-0007 · ₹560","INV-1006 · ₹2,340"].map((x,i)=>'<div class="row"><div><b>'+x.split(" · ")[0]+'</b><small>Today · '+(10-i)+':2'+i+' AM</small></div><b>'+x.split(" · ")[1]+'</b></div>').join("")+'</section></div>'
}
function billing(){
const filtered=products.filter(p=>(p.name+" "+p.sku).toLowerCase().includes(state.search.toLowerCase()));
const subtotal=state.cart.reduce((s,x)=>s+x.price*x.qty,0),tax=subtotal*.05,total=subtotal+tax;
return shell("Fast billing","Search, add items, collect payment and finish the bill.","<button class='btn'>⌕ Barcode Scanner</button>")+
'<div class="pos"><section class="card"><div class="card-head"><div><h3>Products</h3><small>Search by name, SKU or barcode</small></div></div><input class="search" style="width:100%;margin-bottom:12px" placeholder="Search products..." value="'+state.search.replaceAll('"','&quot;')+'" oninput="state.search=this.value;render()"><div class="product-grid">'+filtered.map(p=>'<button class="product" onclick="addCart('+p.id+')"><strong>'+p.name+'</strong><small>'+p.sku+' · Stock '+p.stock+'</small><b>'+money(p.price)+'</b></button>').join("")+'</div><div class="cart">'+(state.cart.length?state.cart.map(x=>'<div class="cart-line"><div><b>'+x.name+'</b><small>'+money(x.price)+' each</small></div><div class="qty"><button onclick="changeQty('+x.id+',-1)">−</button><b>'+x.qty+'</b><button onclick="changeQty('+x.id+',1)">+</button></div><b>'+money(x.price*x.qty)+'</b></div>').join(""):'<div style="padding:35px;text-align:center;color:var(--muted)">Your bill is empty. Add a product to begin.</div>')+'</div></section><aside class="card"><div class="card-head"><h3>New Bill</h3><span class="pill">Draft</span></div><div class="field"><label>Customer</label><input placeholder="Optional customer / phone"></div><div class="totals"><div>Subtotal <b>'+money(subtotal)+'</b></div><div>Tax (5%) <b>'+money(tax)+'</b></div><div class="grand">Total <b>'+money(total)+'</b></div></div><div class="pay">'+["cash","upi","card","bank","other"].map(m=>'<button class="'+(state.method===m?"active":"")+'" onclick="state.method=\''+m+'\';render()">'+m.toUpperCase()+'</button>').join("")+'</div><div class="field"><label>Amount Received</label><input type="number" value="'+(state.cart.length?total:"")+'" placeholder="'+total.toFixed(2)+'"></div><button class="btn primary" style="width:100%" onclick="checkout()">Pay & Print · '+money(total)+'</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px"><button class="btn" onclick="toast('Customer selector ready')">Customer</button><button class="btn pink" onclick="toast('Return flow ready')">Return</button></div></aside></div>'
}
function tablePage(type){
const data=type==="products"?products.map(p=>[p.name,p.sku,p.cat,p.stock,money(p.price)]):
type==="inventory"?products.map(p=>[p.name,p.sku,p.stock,p.min,p.stock<=p.min?"Low Stock":"Healthy"]):
type==="customers"?[["Arun Kumar","9876543210","12","₹8,450","Active"],["Meena Stores","9840011223","7","₹2,100","Active"],["Ravi","9000012345","3","₹0","Active"]]:
type==="suppliers"?[["ABC Distributors","9876500011","24","₹42,800"],["Sri Lakshmi Traders","9842100012","13","₹18,650"],["Metro Wholesale","9000123456","8","₹9,250"]]:
[["INV-1008","07 Oct 2026","Sale","₹1,250","UPI"],["INV-1007","07 Oct 2026","Sale","₹980","Cash"],["PUR-0032","07 Oct 2026","Purchase","₹4,800","Bank"],["RET-0007","07 Oct 2026","Return","₹560","Cash"]];
const headers=type==="products"?["Product","SKU","Category","Stock","Selling Price"]:type==="inventory"?["Product","SKU","Current","Reorder","Status"]:type==="customers"?["Customer","Phone","Bills","Outstanding","Status"]:type==="suppliers"?["Supplier","Phone","Bills","Outstanding"]:["Reference","Date","Type","Amount","Payment"];
return shell(type[0].toUpperCase()+type.slice(1),type==="products"?"Manage your catalog without clutter.":"Keep operational records visible and easy to act on.","<button class='btn primary' onclick="toast('Create '+ '"+type+"'.replace(/^./,c=>c.toUpperCase()) +' dialog ready')">＋ Add New</button>")+
'<section class="card table section-gap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+data.map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i===r.length-1&&["Low Stock","Healthy","Active"].includes(c)?'<span class="pill '+(c==="Low Stock"?"p":"g")+'">'+c+'</span>':c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></section>'
}
function reports(){return shell("Reports & insights","Business-level visibility without an oversized ERP.","<button class='btn'>Export CSV</button>")+"<div class='grid4'><div class='stat'><span class='label'>Sales this month</span><strong>₹4.82L</strong><small>↑ 14.2%</small></div><div class='stat'><span class='label'>Bills</span><strong>612</strong><small>↑ 8.7%</small></div><div class='stat'><span class='label'>Refunds</span><strong>₹8,420</strong><small style='color:var(--pink)'>1.7% of sales</small></div><div class='stat'><span class='label'>Avg. bill</span><strong>₹788</strong><small>↑ 4.8%</small></div></div><div class='two'><section class='card'><div class='card-head'><h3>Sales by category</h3></div>'+["Grocery","Bakery","Beverages","Snacks"].map((x,i)=>'<div class="row"><span>'+x+'</span><b>₹'+(142-i*18)+',800</b></div>').join("")+'</section><section class='card'><div class='card-head'><h3>Payment methods</h3></div>'+["UPI 52%","Cash 24%","Card 16%","Bank 8%"].map(x=>'<div class="row"><span>'+x.split(" ")[0]+'</span><b>'+x.split(" ")[1]+'</b></div>').join("")+'</section></div>'
}
function settings(){return shell("Settings","Business profile, invoice, localization and access controls.","<button class='btn primary' onclick="toast('Settings saved in mock')">Save Changes</button>")+"<div class='two'><section class='card'><h3>Business Profile</h3><div class='field'><label>Business Name</label><input value='Puravigal POS Demo'></div><div class='field'><label>Country</label><select><option>India</option><option>United Arab Emirates</option></select></div><div class='field'><label>Currency</label><select><option>INR — Indian Rupee</option><option>AED — UAE Dirham</option></select></div><div class='field'><label>Timezone</label><select><option>Asia/Kolkata</option><option>Asia/Dubai</option></select></div></section><section class='card'><h3>Invoice & Security</h3><div class='row'><div><b>Invoice prefix</b><small>INV</small></div><button class='btn'>Edit</button></div><div class='row'><div><b>Tax mode</b><small>Exclusive</small></div><button class='btn'>Edit</button></div><div class='row'><div><b>Roles & permissions</b><small>Owner · Admin · Manager · Cashier · Inventory</small></div><button class='btn'>Manage</button></div></section></div>"
}
function page(){if(state.page==="dashboard")return dashboard();if(state.page==="billing")return billing();if(["products","inventory","customers","suppliers"].includes(state.page))return tablePage(state.page);if(state.page==="reports")return reports();if(state.page==="settings")return settings();if(state.page==="purchases"||state.page==="returns")return shell(state.page[0].toUpperCase()+state.page.slice(1),"This workflow is represented in the product mock and ready for API integration.","<button class='btn primary' onclick="toast('Workflow ready')">＋ New</button>")+"<section class='card section-gap'><div class='row'><div><b>Workflow foundation</b><small>UI → domain action → API → PostgreSQL will replace this mock state.</small></div><span class='pill'>Mock Ready</span></div><div class='row'><div><b>External integrations</b><small>WhatsApp, email, payment gateway and tax-provider adapters remain separate.</small></div><span class='pill p'>Pending</span></div></section>";return dashboard()}
function addCart(id){const p=products.find(x=>x.id===id),old=state.cart.find(x=>x.id===id);if(old)old.qty++;else state.cart.push({...p,qty:1});render()}
function changeQty(id,d){const x=state.cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)state.cart=state.cart.filter(i=>i.id!==id);render()}
function checkout(){if(!state.cart.length)return toast("Add at least one product");toast("Mock sale completed · invoice ready");state.cart=[];render()}
function render(){document.getElementById("nav").innerHTML=nav();document.getElementById("mobileNav").innerHTML=navs.slice(0,5).map(([id,ic,label])=>'<button class="'+(state.page===id?"active":"")+'" onclick="setPage(\''+id+'\')"><span>'+ic+'</span>'+label+'</button>').join("");document.getElementById("content").innerHTML=page()}
render();
</script>
</body>
</html>
