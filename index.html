<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puravigal POS — Functional UI Mock</title>
<style>
:root{--blue:#235BDE;--pink:#ED0F79;--ink:#17213b;--muted:#6d778c;--bg:#f6f8fc;--card:#fff;--line:#e3e8f1;--soft:#eef3ff;--green:#159a67;--amber:#c98308;--red:#d9435f;--shadow:0 8px 28px rgba(30,55,100,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.sidebar{position:fixed;inset:0 auto 0 0;width:232px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}.mark{width:34px;height:34px;position:relative}.mark:before,.mark:after{content:"";position:absolute;border-radius:10px 3px 10px 3px;transform:rotate(-42deg)}.mark:before{width:14px;height:25px;left:2px;top:2px;background:var(--blue)}.mark:after{width:14px;height:20px;right:1px;bottom:2px;background:var(--pink)}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.nav-title{font-size:10px;color:#9aa3b3;font-weight:800;letter-spacing:.12em;padding:8px;text-transform:uppercase}.nav button{display:flex;width:100%;gap:11px;align-items:center;border:0;background:transparent;color:#59657a;padding:10px;border-radius:10px;text-align:left;margin:2px 0}.nav button:hover{background:#f7f9fd}.nav button.active{background:var(--soft);color:var(--blue);font-weight:800}.nav .ico{width:22px;text-align:center}.side-foot{margin-top:auto;background:#f8faff;border:1px solid #e7edfa;border-radius:12px;padding:12px}.side-foot b{font-size:12px}.side-foot small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.main{margin-left:232px}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:15}.search{width:min(450px,45vw);border:1px solid #dfe5ee;background:#fff;border-radius:10px;padding:10px 13px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #235bde12}.top-right{display:flex;align-items:center;gap:12px}.store{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.bell{border:0;background:transparent;font-size:18px;position:relative}.badge{position:absolute;right:-3px;top:-4px;background:var(--pink);color:#fff;border-radius:10px;font-size:8px;padding:2px 5px}
.content{padding:24px;max-width:1500px;margin:auto}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:17px}.eyebrow{font-size:10px;letter-spacing:.13em;font-weight:900;color:var(--blue);margin:0 0 5px}.head h1{font-size:26px;letter-spacing:-.02em;margin:0}.head p{color:var(--muted);margin:5px 0 0;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:#4d596d;font-weight:700}.btn:hover{border-color:#b9c7e6}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pink{color:var(--pink);border-color:#f4c8dc;background:#fff7fb}.btn.danger{color:var(--red);border-color:#f0ccd4;background:#fff7f8}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:15px}.stat .label{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin:5px 0}.stat small{font-size:10px;color:var(--green);font-weight:800}.card{padding:17px}.card h3{margin:0;font-size:15px}.muted{color:var(--muted)}.small{font-size:11px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.card-head small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.chart{height:210px;display:flex;align-items:flex-end;gap:14px;padding:18px 12px 10px;border-top:1px solid #f0f2f6}.bar{flex:1;background:linear-gradient(to top,#235bde,#77a0ff);border-radius:7px 7px 2px 2px;min-width:16px;position:relative}.bar i{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-style:normal;font-size:9px;color:#8992a4}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:28px;min-height:210px}.donut{width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--blue) 0 55%,var(--pink) 55% 79%,#7ea8ff 79% 91%,#dce3ef 91%);display:grid;place-items:center}.donut:after{content:"₹24,750";width:92px;height:92px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px}.legend div{font-size:11px;margin:10px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--blue)}.dot.p{background:var(--pink)}.dot.l{background:#7ea8ff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #eef1f5;padding:11px 2px;font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.pill{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:900;background:#eef3ff;color:var(--blue);white-space:nowrap}.pill.p{background:#fff0f6;color:var(--pink)}.pill.g{background:#edf9f3;color:var(--green)}.pill.a{background:#fff7e7;color:var(--amber)}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:11px 9px;border-top:1px solid #edf0f4;font-size:12px}.table th{font-size:9px;color:#8791a4;text-transform:uppercase;background:#fbfcfe}.table tr:hover td{background:#fbfcff}.click{cursor:pointer}.click:hover{color:var(--blue)}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.product{border:1px solid var(--line);background:#fbfcff;border-radius:11px;padding:12px;text-align:left}.product:hover{border-color:#aec1f3;background:#f5f8ff}.product b,.product small,.product strong{display:block}.product small{color:var(--muted);font-size:10px;margin:4px 0}.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;border-top:1px solid #edf0f4;padding:12px 0}.qty{display:flex;align-items:center;gap:7px}.qty button{width:27px;height:27px;border:1px solid var(--line);background:#fff;border-radius:7px}.totals{border-top:1px solid #edf0f4;margin-top:12px;padding-top:10px}.totals div{display:flex;justify-content:space-between;margin:9px 0;font-size:12px}.totals .grand{font-size:18px;font-weight:900;border-top:1px solid #edf0f4;padding-top:12px}.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.pay button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-size:9px;font-weight:800}.pay button.active{color:var(--blue);border-color:var(--blue);background:var(--soft)}
.field{display:block;margin:10px 0}.field label{display:block;font-size:10px;font-weight:800;color:#69748a;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe5ee;border-radius:8px;padding:10px;outline:none;background:#fff}.field textarea{min-height:80px;resize:vertical}.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.toolbar .search{width:300px}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed #d9e0ec;border-radius:12px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,25,45,.42);z-index:80;display:grid;place-items:center;padding:20px}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f3f5f9;border-radius:8px;width:32px;height:32px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;background:#17213b;color:#fff;padding:12px 15px;border-radius:9px;z-index:100;font-size:12px;box-shadow:var(--shadow)}.mobile-nav{display:none}.notice{padding:11px 12px;border-radius:10px;background:#fff7e7;color:#855600;font-size:11px;border:1px solid #f4e1b7;margin-bottom:12px}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.pos{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{display:none}.main{margin:0}.top{height:60px;padding:0 13px}.search{width:58vw}.top-right .store{display:none}.content{padding:14px 14px 82px}.head{align-items:stretch;flex-direction:column}.head h1{font-size:22px}.grid4,.grid3{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat strong{font-size:18px}.product-grid{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:50;justify-content:space-around}.mobile-nav button{border:0;background:none;color:#6d778c;font-size:9px}.mobile-nav button.active{color:var(--blue);font-weight:900}.mobile-nav span{display:block;font-size:17px;margin-bottom:2px}.inline{grid-template-columns:1fr}.toolbar .search{width:100%}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><div class="mark"></div><div><b>Puravigal</b><small>POS · Simple. Fast. Reliable.</small></div></div>
  <div class="nav-title">Workspace</div><nav class="nav" id="nav"></nav>
  <div class="side-foot"><b>Micro POS</b><small>Functional UI mock · local demo data</small></div>
</aside>
<div class="main">
<header class="top">
  <input id="globalSearch" class="search" placeholder="Search products, customers, invoices..." oninput="globalSearch(this.value)">
  <div class="top-right"><button class="store" onclick="openStore()">▣ <span id="storeName">Main Store</span>⌄</button><button class="bell" onclick="showNotifications()">🔔<span class="badge" id="noticeCount">2</span></button><div class="avatar">S</div></div>
</header>
<main class="content" id="content"></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const seed={
products:[
{id:1,name:"Milk 1L",sku:"PRD-001",barcode:"8901001",category:"Dairy",stock:42,reorder:10,cost:48,price:62,tax:5},
{id:2,name:"Bread Loaf",sku:"PRD-002",barcode:"8901002",category:"Bakery",stock:8,reorder:12,cost:30,price:40,tax:5},
{id:3,name:"Maggi Noodles",sku:"PRD-003",barcode:"8901003",category:"Grocery",stock:25,reorder:8,cost:11,price:15,tax:5},
{id:4,name:"Cooking Oil 1L",sku:"PRD-004",barcode:"8901004",category:"Grocery",stock:4,reorder:10,cost:130,price:148,tax:5},
{id:5,name:"Biscuit Pack",sku:"PRD-005",barcode:"8901005",category:"Snacks",stock:31,reorder:10,cost:27,price:35,tax:5},
{id:6,name:"Chocolate Bar",sku:"PRD-006",barcode:"8901006",category:"Snacks",stock:19,reorder:8,cost:38,price:50,tax:5},
{id:7,name:"Water Bottle",sku:"PRD-007",barcode:"8901007",category:"Beverages",stock:55,reorder:15,cost:14,price:20,tax:5},
{id:8,name:"Tea Powder 250g",sku:"PRD-008",barcode:"8901008",category:"Grocery",stock:13,reorder:8,cost:72,price:92,tax:5}
],
customers:[
{id:1,name:"Arun Kumar",phone:"9876543210",email:"arun@example.com",outstanding:8450},
{id:2,name:"Meena Stores",phone:"9840011223",email:"meena@example.com",outstanding:2100},
{id:3,name:"Ravi",phone:"9000012345",email:"",outstanding:0}
],
suppliers:[
{id:1,name:"ABC Distributors",phone:"9876500011",outstanding:42800},
{id:2,name:"Sri Lakshmi Traders",phone:"9842100012",outstanding:18650},
{id:3,name:"Metro Wholesale",phone:"9000123456",outstanding:9250}
],
sales:[
{id:"INV-1008",date:"07 Oct 2026",customer:"Walk-in",items:[{productId:1,qty:5,price:62}],total:325,payment:"UPI"},
{id:"INV-1007",date:"07 Oct 2026",customer:"Arun Kumar",items:[{productId:5,qty:10,price:35}],total:367.5,payment:"Cash"},
{id:"INV-1006",date:"07 Oct 2026",customer:"Walk-in",items:[{productId:7,qty:8,price:20}],total:168,payment:"Card"}
],
purchases:[
{id:"PUR-0032",date:"07 Oct 2026",supplier:"ABC Distributors",total:4800,status:"Received"},
{id:"PUR-0031",date:"06 Oct 2026",supplier:"Sri Lakshmi Traders",total:3200,status:"Received"}
],
returns:[{id:"RET-0007",date:"07 Oct 2026",invoice:"INV-1007",amount:175,status:"Completed"}],
activity:[],
settings:{business:"Puravigal POS Demo",country:"India",currency:"INR",timezone:"Asia/Kolkata",tax:5,prefix:"INV"}
};
let db=loadDB();
let state={page:"dashboard",search:"",cart:[],method:"cash",customerId:"",amountReceived:"",global:""};

const navs=[["dashboard","⌂","Dashboard"],["billing","₹","Billing"],["products","▦","Products"],["inventory","◈","Inventory"],["purchases","↗","Purchases"],["customers","◎","Customers"],["suppliers","◇","Suppliers"],["reports","▥","Reports"],["returns","↩","Returns"],["settings","⚙","Settings"]];

function cloneSeed(){return JSON.parse(JSON.stringify(seed))}
function loadDB(){
  try{
    const raw=localStorage.getItem("puravigal-pos-mock");
    if(!raw)return cloneSeed();
    const x=JSON.parse(raw);
    const d=cloneSeed();
    if(!x||typeof x!=="object")return d;
    d.products=Array.isArray(x.products)?x.products:d.products;
    d.customers=Array.isArray(x.customers)?x.customers:d.customers;
    d.suppliers=Array.isArray(x.suppliers)?x.suppliers:d.suppliers;
    d.sales=Array.isArray(x.sales)?x.sales:d.sales;
    d.purchases=Array.isArray(x.purchases)?x.purchases:d.purchases;
    d.returns=Array.isArray(x.returns)?x.returns:d.returns;
    d.activity=Array.isArray(x.activity)?x.activity:d.activity;
    d.settings=Object.assign(d.settings,x.settings&&typeof x.settings==="object"?x.settings:{});
    return d;
  }catch(e){
    localStorage.removeItem("puravigal-pos-mock");
    return cloneSeed();
  }
}
function saveDB(){localStorage.setItem("puravigal-pos-mock",JSON.stringify(db))}
function money(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:db.settings.currency||"INR",maximumFractionDigits:2}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function toast(t){document.getElementById("toastRoot").innerHTML="<div class='toast'>"+esc(t)+"</div>";clearTimeout(window._toast);window._toast=setTimeout(()=>document.getElementById("toastRoot").innerHTML="",2300)}
function nav(){return navs.map(([id,ic,label])=>"<button class='"+(state.page===id?"active":"")+"' onclick=\"setPage('"+id+"')\"><span class='ico'>"+ic+"</span>"+label+"</button>").join("")}
function setPage(p){state.page=p;state.search="";state.global="";document.getElementById("globalSearch").value="";render()}
function shell(title,sub,actions){return "<div class='head'><div><p class='eyebrow'>PURAVIGAL POS</p><h1>"+title+"</h1><p>"+sub+"</p></div><div class='actions'>"+(actions||"")+"</div></div>"}
function stat(label,value,note,cls){return "<div class='stat'><span class='label'>"+label+"</span><strong>"+value+"</strong><small class='"+(cls||"")+"'>"+note+"</small></div>"}
function dashboard(){
 const todaySales=db.sales.reduce((s,x)=>s+Number(x.total),0);
 const low=db.products.filter(p=>p.stock<=p.reorder);
 const outstanding=db.customers.reduce((s,c)=>s+Number(c.outstanding),0);
 const days=[3100,4800,3900,5200,6100,7400,todaySales];
 return shell("Good morning, Selva!","Clear numbers, faster billing and a calm retail workflow.","<button class='btn primary' onclick=\"setPage('billing')\">＋ New Bill</button><button class='btn' onclick=\"setPage('products')\">Manage Products</button>")+
 "<div class='grid4'>"+stat("Sales Today",money(todaySales),"↑ Live from demo sales")+stat("Total Bills",db.sales.length,"↑ Updated instantly")+stat("Average Bill",money(db.sales.length?todaySales/db.sales.length:0),"Based on current bills")+stat("Outstanding",money(outstanding),"Customer ledger","")+"</div>"+
 "<div class='two'><section class='card'><div class='card-head'><div><h3>Sales Overview</h3><small>Last 7 demo days</small></div><button class='btn' onclick=\"toast('Date filter is UI-ready')\">Last 7 Days⌄</button></div><div class='chart'>"+days.map((x,i)=>"<div class='bar' style='height:"+Math.max(15,Math.min(100,x/80))+"%'><i>"+["01 Oct","02","03","04","05","06","07"][i]+"</i></div>").join("")+"</div></section>"+
 "<section class='card'><div class='card-head'><div><h3>Payment Breakdown</h3><small>Current demo sales</small></div></div><div class='donut-wrap'><div class='donut'></div><div class='legend'><div><i class='dot'></i>UPI · 52%</div><div><i class='dot p'></i>Cash · 24%</div><div><i class='dot l'></i>Card · 16%</div><div><i class='dot' style='background:#dce3ef'></i>Others · 8%</div></div></div></section></div>"+
 "<div class='two'><section class='card'><div class='card-head'><div><h3>Low Stock</h3><small>"+low.length+" items need attention</small></div><button class='btn' onclick=\"setPage('inventory')\">View All →</button></div>"+(low.length?low.map(p=>"<div class='row'><div><b>"+esc(p.name)+"</b><small>"+esc(p.sku)+"</small></div><span class='pill p'>"+p.stock+" left</span></div>").join(""):"<div class='empty'>All products are above reorder level.</div>")+"</section>"+
 "<section class='card'><div class='card-head'><div><h3>Recent Transactions</h3><small>Latest activity</small></div><button class='btn' onclick=\"setPage('reports')\">View All →</button></div>"+db.sales.slice(-5).reverse().map(x=>"<div class='row click' onclick=\"viewInvoice('"+x.id+"')\"><div><b>"+x.id+"</b><small>"+x.date+" · "+esc(x.customer)+"</small></div><b>"+money(x.total)+"</b></div>").join("")+"</section></div>";
}
function billing(){
 const q=state.search.toLowerCase();
 const list=db.products.filter(p=>(p.name+" "+p.sku+" "+p.barcode).toLowerCase().includes(q));
 const subtotal=state.cart.reduce((s,x)=>s+x.price*x.qty,0);
 const tax=state.cart.reduce((s,x)=>s+x.price*x.qty*(x.tax||db.settings.tax)/100,0);
 const total=subtotal+tax;
 return shell("Fast billing","Search, add items, collect payment and finish the bill.","<button class='btn' onclick=\"barcodePrompt()\">⌕ Barcode Scanner</button><button class='btn' onclick=\"clearCart()\">Clear Bill</button>")+
 "<div class='pos'><section class='card'><div class='card-head'><div><h3>Products</h3><small>Click a product to add it to the bill</small></div><span class='pill'>"+list.length+" results</span></div>"+
 "<input class='search' style='width:100%;margin-bottom:12px' placeholder='Search name, SKU or barcode...' value='"+esc(state.search)+"' oninput=\"state.search=this.value;render()\">"+
 "<div class='product-grid'>"+(list.length?list.map(p=>"<button class='product' onclick='addCart("+p.id+")' "+(p.stock<=0?"disabled":"")+"><strong>"+esc(p.name)+"</strong><small>"+esc(p.sku)+" · Stock "+p.stock+"</small><b>"+money(p.price)+"</b></button>").join(""):"<div class='empty' style='grid-column:1/-1'>No products found.</div>")+"</div>"+
 "<div class='cart'>"+(state.cart.length?state.cart.map(x=>"<div class='cart-line'><div><b>"+esc(x.name)+"</b><small>"+money(x.price)+" each · "+x.tax+"% tax</small></div><div class='qty'><button onclick='changeQty("+x.id+",-1)'>−</button><b>"+x.qty+"</b><button onclick='changeQty("+x.id+",1)'>+</button></div><b>"+money(x.price*x.qty)+"</b></div>").join(""):"<div class='empty'>Your bill is empty. Add a product to begin.</div>")+"</div></section>"+
 "<aside class='card'><div class='card-head'><h3>New Bill</h3><span class='pill'>Draft</span></div>"+
 "<div class='field'><label>Customer</label><select onchange='state.customerId=this.value'><option value=''>Walk-in Customer</option>"+db.customers.map(c=>"<option value='"+c.id+"' "+(String(state.customerId)===String(c.id)?"selected":"")+">"+esc(c.name)+" · "+esc(c.phone)+"</option>").join("")+"</select></div>"+
 "<div class='totals'><div>Subtotal <b>"+money(subtotal)+"</b></div><div>Tax <b>"+money(tax)+"</b></div><div class='grand'>Total <b>"+money(total)+"</b></div></div>"+
 "<div class='pay'>"+["cash","upi","card","bank","other"].map(m=>"<button class='"+(state.method===m?"active":"")+"' onclick=\"state.method='"+m+"';render()\">"+m.toUpperCase()+"</button>").join("")+"</div>"+
 "<div class='field'><label>Amount Received</label><input type='number' min='0' value='"+esc(state.amountReceived)+"' oninput='state.amountReceived=this.value' placeholder='"+total.toFixed(2)+"'></div>"+
 "<div class='row'><span>Change</span><b>"+money(Math.max(0,(Number(state.amountReceived)||0)-total))+"</b></div>"+
 "<button class='btn primary' style='width:100%;margin-top:10px' onclick='checkout()'>Pay & Print · "+money(total)+"</button>"+
 "<div style='display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px'><button class='btn' onclick=\"openCustomerModal()\">＋ Customer</button><button class='btn pink' onclick=\"setPage('returns')\">↩ Return</button></div></aside></div>";
}
function productRows(){
 const q=state.search.toLowerCase();const a=db.products.filter(p=>(p.name+" "+p.sku+" "+p.category).toLowerCase().includes(q));

function page(){
 if(state.page==="dashboard")return dashboard();
 if(state.page==="billing")return billing();
 if(state.page==="products")return shell("Products","Manage your catalog, pricing and reorder levels.","")+productRows();
 if(state.page==="inventory")return inventory();
 if(state.page==="customers")return customers();
 if(state.page==="suppliers")return suppliers();
 if(state.page==="purchases")return purchases();
 if(state.page==="reports")return reports();
 if(state.page==="returns")return returnsPage();
 if(state.page==="settings")return settings();
 return dashboard();
}
function addCart(id){const p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast("Product is out of stock");const x=state.cart.find(i=>i.id===id);if(x){if(x.qty>=p.stock)return toast("Not enough stock");x.qty++}else state.cart.push({id:p.id,name:p.name,price:p.price,tax:p.tax,qty:1});render()}
function changeQty(id,d){const x=state.cart.find(i=>i.id===id),p=db.products.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty>p.stock)x.qty=p.stock;if(x.qty<=0)state.cart=state.cart.filter(i=>i.id!==id);render()}
function clearCart(){state.cart=[];state.customerId="";state.amountReceived="";render()}
function checkout(){
 const subtotal=state.cart.reduce((s,x)=>s+x.price*x.qty,0),tax=state.cart.reduce((s,x)=>s+x.price*x.qty*x.tax/100,0),total=subtotal+tax;
 if(!state.cart.length)return toast("Add at least one product");
 if((Number(state.amountReceived)||0)<total)return toast("Amount received is less than total");
 const num=1009+db.sales.length;const invoice=db.settings.prefix+"-"+num;
 state.cart.forEach(x=>{const p=db.products.find(p=>p.id===x.id);p.stock-=x.qty});
 const customer=db.customers.find(c=>String(c.id)===String(state.customerId));
 db.sales.push({id:invoice,date:"08 Oct 2026",customer:customer?customer.name:"Walk-in",items:state.cart.map(x=>({productId:x.id,qty:x.qty,price:x.price})),total,payment:state.method});
 db.activity.push({text:"Sale "+invoice+" completed",time:"Just now"});
 saveDB();toast(invoice+" completed successfully");viewInvoice(invoice);state.cart=[];state.amountReceived="";state.customerId="";render();
}
function invoiceHTML(s){return "<div class='card' style='box-shadow:none;border:0;padding:0'><h2 style='margin:0 0 4px'>"+s.id+"</h2><p class='muted small'>"+s.date+" · "+esc(s.customer)+" · "+s.payment.toUpperCase()+"</p><div class='table' style='margin-top:12px'><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody>"+s.items.map(i=>{const p=db.products.find(p=>p.id===i.productId);return "<tr><td>"+esc(p?p.name:"Item")+"</td><td>"+i.qty+"</td><td>"+money(i.price)+"</td><td>"+money(i.price*i.qty)+"</td></tr>"}).join("")+"</tbody></table></div><div class='totals'><div class='grand'>Invoice Total <b>"+money(s.total)+"</b></div></div></div>"}
function viewInvoice(id){const s=db.sales.find(x=>x.id===id);if(!s)return;openModal("Invoice "+id,invoiceHTML(s),"<button class='btn' onclick='printInvoice(\""+id+"\")'>Print</button><button class='btn primary' onclick='closeModal()'>Done</button>")}
function printInvoice(id){const s=db.sales.find(x=>x.id===id);if(!s)return;const w=window.open("","_blank","width=700,height=800");if(!w)return toast("Allow pop-ups to print");w.document.write("<html><head><title>"+id+"</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>Puravigal POS</h1>"+invoiceHTML(s)+"</body></html>");w.document.close();w.focus();w.print()}
function openModal(title,body,actions){document.getElementById("modalRoot").innerHTML="<div class='modal-backdrop' onclick='backdropClose(event)'><div class='modal'><div class='modal-head'><h2>"+title+"</h2><button class='close' onclick='closeModal()'>×</button></div>"+body+"<div class='modal-actions'>"+(actions||"<button class='btn' onclick='closeModal()'>Close</button>")+"</div></div></div>"}
function backdropClose(e){if(e.target.classList.contains("modal-backdrop"))closeModal()}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function openProductModal(id){
 const p=id?db.products.find(x=>x.id===id):{name:"",sku:"PRD-"+String(db.products.length+1).padStart(3,"0"),barcode:"",category:"Grocery",stock:0,reorder:10,cost:0,price:0,tax:5};
 openModal(id?"Edit Product":"Add Product","<div class='inline'><div class='field'><label>Name</label><input id='pmName' value='"+esc(p.name)+"'></div><div class='field'><label>SKU</label><input id='pmSku' value='"+esc(p.sku)+"'></div></div><div class='inline'><div class='field'><label>Category</label><input id='pmCat' value='"+esc(p.category)+"'></div><div class='field'><label>Barcode</label><input id='pmBarcode' value='"+esc(p.barcode)+"'></div></div><div class='inline'><div class='field'><label>Cost</label><input id='pmCost' type='number' value='"+p.cost+"'></div><div class='field'><label>Selling Price</label><input id='pmPrice' type='number' value='"+p.price+"'></div></div><div class='inline'><div class='field'><label>Stock</label><input id='pmStock' type='number' value='"+p.stock+"'></div><div class='field'><label>Reorder Level</label><input id='pmReorder' type='number' value='"+p.reorder+"'></div></div>","<button class='btn' onclick='closeModal()'>Cancel</button><button class='btn primary' onclick='saveProduct("+ (id||"null") +")'>Save Product</button>");
}
function saveProduct(id){const p=id?db.products.find(x=>x.id===id):{id:Date.now()};p.name=document.getElementById("pmName").value.trim();p.sku=document.getElementById("pmSku").value.trim();p.category=document.getElementById("pmCat").value.trim();p.barcode=document.getElementById("pmBarcode").value.trim();p.cost=Number(document.getElementById("pmCost").value)||0;p.price=Number(document.getElementById("pmPrice").value)||0;p.stock=Number(document.getElementById("pmStock").value)||0;p.reorder=Number(document.getElementById("pmReorder").value)||0;p.tax=db.settings.tax;if(!p.name||!p.sku)return toast("Name and SKU are required");if(!id)db.products.push(p);saveDB();closeModal();toast("Product saved");render()}
function openStockModal(id){
 const options=db.products.map(p=>"<option value='"+p.id+"' "+(id===p.id?"selected":"")+">"+esc(p.name)+" · "+p.stock+" in stock</option>").join("");
 openModal("Adjust Stock","<div class='field'><label>Product</label><select id='smProduct'>"+options+"</select></div><div class='inline'><div class='field'><label>Adjustment</label><input id='smQty' type='number' placeholder='Use +10 or -2'></div><div class='field'><label>Reason</label><select id='smReason'><option>Manual Count</option><option>Damage</option><option>Opening Stock</option><option>Correction</option></select></div></div>","<button class='btn' onclick='closeModal()'>Cancel</button><button class='btn primary' onclick='saveStock()'>Apply Adjustment</button>");
}
function saveStock(){const p=db.products.find(x=>x.id===Number(document.getElementById("smProduct").value));const d=Number(document.getElementById("smQty").value);if(!p||!d)return toast("Enter a non-zero adjustment");if(p.stock+d<0)return toast("Stock cannot go below zero");p.stock+=d;db.activity.push({text:"Stock adjusted: "+p.name+" ("+(d>0?"+":"")+d+")",time:"Just now"});saveDB();closeModal();toast("Stock updated");render()}
function openCustomerModal(id){
 const c=id?db.customers.find(x=>x.id===id):{name:"",phone:"",email:"",outstanding:0};
 openModal(id?"Edit Customer":"Add Customer","<div class='field'><label>Name</label><input id='cmName' value='"+esc(c.name)+"'></div><div class='inline'><div class='field'><label>Phone</label><input id='cmPhone' value='"+esc(c.phone)+"'></div><div class='field'><label>Email</label><input id='cmEmail' value='"+esc(c.email)+"'></div></div>","<button class='btn' onclick='closeModal()'>Cancel</button><button class='btn primary' onclick='saveCustomer("+(id||"null")+")'>Save Customer</button>");
}
function saveCustomer(id){const c=id?db.customers.find(x=>x.id===id):{id:Date.now(),outstanding:0};c.name=document.getElementById("cmName").value.trim();c.phone=document.getElementById("cmPhone").value.trim();c.email=document.getElementById("cmEmail").value.trim();if(!c.name||!c.phone)return toast("Name and phone are required");if(!id)db.customers.push(c);saveDB();closeModal();toast("Customer saved");render()}
function customerLedger(id){const c=db.customers.find(x=>x.id===id);if(!c)return;const rows=db.sales.filter(s=>s.customer===c.name);openModal("Customer Ledger","<p><b>"+esc(c.name)+"</b><br><span class='muted small'>"+esc(c.phone)+" · Outstanding "+money(c.outstanding)+"</span></p>"+(rows.length?rows.map(s=>"<div class='row'><span>"+s.id+"<small>"+s.date+" · "+s.payment+"</small></span><b>"+money(s.total)+"</b></div>").join(""):"<div class='empty'>No invoices for this customer.</div>"))}
function openSupplierModal(id){
 const s=id?db.suppliers.find(x=>x.id===id):{name:"",phone:"",outstanding:0};
 openModal(id?"Edit Supplier":"Add Supplier","<div class='field'><label>Supplier Name</label><input id='smName' value='"+esc(s.name)+"'></div><div class='inline'><div class='field'><label>Phone</label><input id='smPhone' value='"+esc(s.phone)+"'></div><div class='field'><label>Outstanding</label><input id='smOutstanding' type='number' value='"+s.outstanding+"'></div></div>","<button class='btn' onclick='closeModal()'>Cancel</button><button class='btn primary' onclick='saveSupplier("+(id||"null")+")'>Save Supplier</button>");
}
function saveSupplier(id){const s=id?db.suppliers.find(x=>x.id===id):{id:Date.now()};s.name=document.getElementById("smName").value.trim();s.phone=document.getElementById("smPhone").value.trim();s.outstanding=Number(document.getElementById("smOutstanding").value)||0;if(!s.name||!s.phone)return toast("Supplier name and phone are required");if(!id)db.suppliers.push(s);saveDB();closeModal();toast("Supplier saved");render()}
function supplierLedger(id){const s=db.suppliers.find(x=>x.id===id);const rows=db.purchases.filter(p=>p.supplier===s.name);openModal("Supplier Ledger","<p><b>"+esc(s.name)+"</b><br><span class='muted small'>"+s.phone+" · Outstanding "+money(s.outstanding)+"</span></p>"+(rows.length?rows.map(p=>"<div class='row'><span>"+p.id+"<small>"+p.date+" · "+p.status+"</small></span><b>"+money(p.total)+"</b></div>").join(""):"<div class='empty'>No purchases for this supplier.</div>"))}
function openPurchaseModal(){
 openModal("New Purchase","<div class='field'><label>Supplier</label><select id='purSupplier'>"+db.suppliers.map(s=>"<option>"+esc(s.name)+"</option>").join("")+"</select></div><div class='field'><label>Product</label><select id='purProduct'>"+db.products.map(p=>"<option value='"+p.id+"'>"+esc(p.name)+"</option>").join("")+"</select></div><div class='inline'><div class='field'><label>Quantity</label><input id='purQty' type='number' value='10'></div><div class='field'><label>Unit Cost</label><input id='purCost' type='number' value='0'></div></div>","<button class='btn' onclick='closeModal()'>Cancel</button><button class='btn primary' onclick='savePurchase()'>Create & Receive</button>");
}
function savePurchase(){const supplier=document.getElementById("purSupplier").value,pid=Number(document.getElementById("purProduct").value),qty=Number(document.getElementById("purQty").value),cost=Number(document.getElementById("purCost").value)||0,p=db.products.find(x=>x.id===pid);if(!p||qty<=0)return toast("Enter a valid quantity");p.stock+=qty;const id="PUR-"+String(33+db.purchases.length).padStart(4,"0");db.purchases.push({id,date:"08 Oct 2026",supplier,total:qty*(cost||p.cost),status:"Received"});db.activity.push({text:"Purchase "+id+" received",time:"Just now"});saveDB();closeModal();toast(id+" received · stock updated");render()}
function receivePurchase(id){const p=db.purchases.find(x=>x.id===id);if(!p)return;p.status="Received";saveDB();toast(id+" marked received");render()}
function openReturnModal(invoice){
 const s=db.sales.find(x=>x.id===invoice);if(!s)return;
 openModal("Return "+invoice,s.items.map((i,idx)=>{const p=db.products.find(p=>p.id===i.productId);return "<div class='row'><div><b>"+esc(p?p.name:"Item")+"</b><small>Sold "+i.qty+" · "+money(i.price)+" each</small></div><input id='retQty"+idx+"' type='number' min='0' max='"+i.qty+"' value='"+i.qty+"' style='width:80px;border:1px solid #dfe5ee;border-radius:7px;padding:7px'></div>"}).join(""),"<button class='btn' onclick='closeModal()'>Cancel</button><button class='btn pink' onclick='saveReturn(\""+invoice+"\")'>Process Return</button>");
}
function saveReturn(invoice){const s=db.sales.find(x=>x.id===invoice);let amount=0;s.items.forEach((i,idx)=>{const q=Math.min(i.qty,Math.max(0,Number(document.getElementById("retQty"+idx).value)||0));if(q){const p=db.products.find(p=>p.id===i.productId);if(p)p.stock+=q;amount+=q*i.price}});if(!amount)return toast("Enter a return quantity");const id="RET-"+String(8+db.returns.length).padStart(4,"0");db.returns.push({id,date:"08 Oct 2026",invoice,amount,status:"Completed"});saveDB();closeModal();toast(id+" completed · stock restored");render()}
function viewReturn(id){const r=db.returns.find(x=>x.id===id);openModal(id,"<div class='row'><span>Invoice</span><b>"+r.invoice+"</b></div><div class='row'><span>Refund</span><b>"+money(r.amount)+"</b></div><div class='row'><span>Status</span><span class='pill g'>"+r.status+"</span></div>")}
function saveSettings(){db.settings.business=document.getElementById("setBusiness").value.trim()||"Puravigal POS Demo";db.settings.country=document.getElementById("setCountry").value;db.settings.currency=document.getElementById("setCurrency").value;db.settings.timezone=document.getElementById("setTimezone").value;db.settings.tax=Number(document.getElementById("setTax").value)||0;db.settings.prefix=document.getElementById("setPrefix").value.trim()||"INV";saveDB();document.getElementById("storeName").textContent="Main Store";toast("Settings saved")}
function resetDemo(){if(!confirm("Reset all mock data?"))return;db=cloneSeed();saveDB();state={page:"dashboard",search:"",cart:[],method:"cash",customerId:"",amountReceived:"",global:""};closeModal();toast("Demo data reset");render()}
function exportCSV(type){let rows=[],name=type+".csv";if(type==="products"){rows=[["Name","SKU","Category","Stock","Cost","Price"],...db.products.map(p=>[p.name,p.sku,p.category,p.stock,p.cost,p.price])]}else if(type==="customers"){rows=[["Name","Phone","Email","Outstanding"],...db.customers.map(c=>[c.name,c.phone,c.email,c.outstanding])]}else{rows=[["Invoice","Date","Customer","Total","Payment"],...db.sales.map(s=>[s.id,s.date,s.customer,s.total,s.payment])]}const csv=rows.map(r=>r.map(v=>'\"'+String(v).replaceAll('\"','\"\"')+'\"').join(",")).join("\\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast("CSV exported")}
function globalSearch(q){state.global=q.trim();if(!q){if(state.page!=="dashboard")render();return}const x=q.toLowerCase();const p=db.products.find(p=>(p.name+" "+p.sku+" "+p.barcode).toLowerCase().includes(x));if(p){setPage("products");state.search=q;render();return}const c=db.customers.find(c=>(c.name+" "+c.phone).toLowerCase().includes(x));if(c){setPage("customers");state.search=q;render();return}const s=db.sales.find(s=>s.id.toLowerCase().includes(x));if(s){viewInvoice(s.id);return}toast("No matching product, customer or invoice")}
function barcodePrompt(){const b=prompt("Enter product barcode");if(!b)return;const p=db.products.find(x=>x.barcode===b);if(!p)return toast("Barcode not found");addCart(p.id)}
function openStore(){openModal("Store","<div class='row'><div><b>Main Store</b><small>Current demo location · India</small></div><span class='pill g'>Active</span></div><div class='row'><div><b>Branch Store</b><small>Demo option for multi-store UI</small></div><button class='btn' onclick=\"toast('Store switching is ready for API integration');closeModal()\">Select</button></div>")}
function showNotifications(){openModal("Notifications","<div class='row'><div><b>Low stock alert</b><small>Cooking Oil 1L and Bread Loaf need attention.</small></div><span class='pill p'>Stock</span></div><div class='row'><div><b>Demo mode</b><small>API is not connected. All changes are stored in this browser.</small></div><span class='pill a'>Mock</span></div>")}
function render(){document.getElementById("nav").innerHTML=nav();document.getElementById("mobileNav").innerHTML=navs.slice(0,5).map(([id,ic,label])=>"<button class='"+(state.page===id?"active":"")+"' onclick=\"setPage('"+id+"')\"><span>"+ic+"</span>"+label+"</button>").join("");document.getElementById("content").innerHTML=page();document.getElementById("storeName").textContent="Main Store";document.getElementById("noticeCount").textContent=db.products.filter(p=>p.stock<=p.reorder).length}
render();
</script>
</body>
</html>
